function tick(){
 var v=$("cv");if(!stream||!v)return;
 if(v.readyState>=2&&v.videoWidth){var c=document.createElement("canvas");c.width=v.videoWidth;c.height=v.videoHeight;var x=c.getContext("2d");x.drawImage(v,0,0);var r=dec(x.getImageData(0,0,c.width,c.height));if(r&&handle(r))return}
 tm=setTimeout(tick,200)}
function handle(t){
 var p=String(t).split("|"),m=$("qm"),M=p[1]==="M";
 if(p[0]!=="TAKAPAY"||p.length<3||(!M&&p[1]!=="P")){if(m)m.textContent="That isn’t a Taka Pay QR code.";return false}
 if(!M&&!PH.test(p[2])){if(m)m.textContent="That code has an invalid phone number.";return false}
 stop();var a=parseFloat(p[M?3:4]);a=a>0?String(a):"";draft=null;
 if(M){var n=p[2].slice(0,30);if(SHOPS.indexOf(n)<0)SHOPS.push(n);cur="pay";form({shop:n,amount:a,mno:PH.test(p[4]||"")?p[4]:""})}
 else{cur="send";form({phone:p[2],amount:a})}
 return true}
function img(f,cb){var r=new FileReader();r.onload=function(){var i=new Image();i.onload=function(){cb(i)};i.onerror=function(){cb(null)};i.src=r.result};r.onerror=function(){cb(null)};r.readAsDataURL(f)}
document.addEventListener("change",function(e){
 var f=e.target.files&&e.target.files[0];if(!f)return;
 if(e.target.id==="pic")img(f,function(i){if(!i)return;var c=document.createElement("canvas");c.width=c.height=160;var m=Math.min(i.width,i.height);c.getContext("2d").drawImage(i,(i.width-m)/2,(i.height-m)/2,m,m,0,0,160,160);S.pic=c.toDataURL("image/jpeg",.82);save();render()});
 if(e.target.id==="qf")img(f,function(i){var m=$("qm");if(!i){m.textContent="Couldn’t read that image.";return}var k=Math.min(1,800/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);var x=c.getContext("2d");x.drawImage(i,0,0,c.width,c.height);var r=dec(x.getImageData(0,0,c.width,c.height));if(!r||!handle(r)){if(!r)m.textContent="No QR code found in that image."}});
});
function close(){stop();$("sheet").classList.remove("on");draft=null}

document.addEventListener("click",function(e){
 var tx=e.target.closest("[data-tx]");if(tx&&!e.target.closest("button"))return receipt(tx.dataset.tx);
 var t=e.target.closest("button");if(!t){if(e.target.id==="sheet")close();return}
 if(t.dataset.svc)return open(t.dataset.svc);
 if(t.dataset.go)return go(t.dataset.go);
 if(t.dataset.th){S.theme=t.dataset.th;save();applyTheme();return settings()}

 if(t.dataset.fill){$("f_phone").value=t.dataset.fill;return}
 if(t.dataset.amt){$("f_amount").value=t.dataset.amt;return}
 if(t.dataset.lk){var lk=S.lk[Number(t.dataset.lk)];if(lk){$("f_bank").value=lk.b;$("f_acct").value=lk.n}return}
 if(t.dataset.rmlk){S.lk.splice(Number(t.dataset.rmlk),1);save();return addMenu()}
 if(t.id==="tpin")return pinStep();
 if(t.id==="pinok"){if($("pin").value!==S.pin){$("pe").textContent="Wrong PIN. Try again.";return}return holdStep()}
 if(t.id==="rf")return refresh();
 if(t.dataset.k)return key(t.dataset.k);
 if(t.dataset.sn){ST=t.dataset.sn;return settings()}
 if(t.dataset.bell)return notifs();
 if(t.id==="forgot"){S=JSON.parse(JSON.stringify(def));S.tx[0].t=Date.now();save();applyTheme();applyStyle();go("home");return lock("new")}
 if(t.id==="locknow"){$("sheet").classList.remove("on");stop();return lock("unlock")}
 if(t.id==="apok"){if($("apin").value!==S.pin){$("ape").textContent="Wrong PIN.";return}var f=AP;AP=null;close();return f&&f()}
 if(t.dataset.tg==="lock"){if(S.lock)return askPin("Turn off app lock",function(){S.lock=false;addLog("App lock turned off");save();render()});S.lock=true;addLog("App lock turned on");save();return render()}
 if(t.id==="spin2"){var e2=$("e2");e2.style.color="";
  if($("op").value!==S.pin){e2.textContent="Current PIN is wrong.";return}
  if(!/^\d{4}$/.test($("np").value)){e2.textContent="New PIN must be exactly 4 digits.";return}
  if($("np").value!==$("cp").value){e2.textContent="New PINs don’t match.";return}
  if($("np").value===S.pin){e2.textContent="Choose a PIN you haven’t used now.";return}
  S.pin=$("np").value;addLog("PIN changed");save();render();e2=$("e2");e2.style.color="var(--ok)";e2.textContent="PIN updated.";return}
 if(t.dataset.q)return qrui(t.dataset.q);
 if(t.dataset.h){H[t.dataset.h]=t.dataset.v;return hist()}
 if(t.dataset.rmpic){S.pic="";save();return render()}
 if(t.id==="qdemo")return handle("TAKAPAY|M|Spice Garden Restaurant|480|01811223344");
 if(t.id==="copyst")return copyst();
 if(t.id==="savename"){var nn=$("setname").value.trim();if(nn.length<2){$("m3").textContent="Enter at least 2 characters.";return}S.name=nn;save();render();$("m3").textContent="Name saved.";return}
 if(t.dataset.pal){S.pal=t.dataset.pal;save();applyStyle();return settings()}
 if(t.dataset.st){S[t.dataset.st]=t.dataset.v;save();applyStyle();return render()}
 if(t.dataset.tg){S[t.dataset.tg]=!S[t.dataset.tg];save();return render()}
 switch(t.id){
  case"eye":S.hide=!S.hide;save();return home();
  case"x":return close();
  case"rev":return review();
  case"back":return form(draft?draft.v:{});
  case"pay":return pay();
  case"sname":var n=$("pname").value.trim();if(n.length<2){$("m1").textContent="Enter at least 2 characters.";return}S.name=n;save();render();$("m1").textContent="Name saved.";return;
  case"spin":if($("op").value!==S.pin){$("e2").textContent="Current PIN is wrong.";return}
   if(!/^\d{4}$/.test($("np").value)){$("e2").textContent="New PIN must be exactly 4 digits.";return}
   S.pin=$("np").value;save();$("op").value="";$("np").value="";$("e2").textContent="";$("e2").style.color="var(--ok)";$("e2").textContent="PIN updated.";return;
  case"rst":S=JSON.parse(JSON.stringify(def));S.tx[0].t=Date.now();save();applyTheme();applyStyle();go("home");return lock("new");
 }
});
document.body.classList.add("intro");setTimeout(function(){document.body.classList.remove("intro")},1400);applyTheme();applyStyle();go("home");if(!S.setup)lock("new");else if(S.lock)lock("unlock");
})();
</script>
</body>
</html>
